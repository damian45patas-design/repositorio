name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android --org com.example ytm_client
      - run: |
          for z in ./*.zip; do unzip -q "$z" -d src; done
          SRC=$(dirname "$(find src -name pubspec.yaml | head -1)")
          rm -rf ytm_client/lib ytm_client/test ytm_client/analysis_options.yaml
          cp -r "$SRC/lib" ytm_client/lib
          cp "$SRC/pubspec.yaml" ytm_client/pubspec.yaml
          cp "$SRC/android_manifest/AndroidManifest.xml" ytm_client/android/app/src/main/AndroidManifest.xml
      - working-directory: ytm_client
        run: flutter pub get
      - working-directory: ytm_client
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: ytm-client-apk
          path: ytm_client/build/app/outputs/flutter-apk/app-release.apk
